services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --db=postgres
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: FileSharingSystemDataBase
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/FileSharingSystemDataBase
      KC_DB_USERNAME: keyloack
      KC_DB_PASSWORD: keyloack
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

volumes:
  keycloak_data: